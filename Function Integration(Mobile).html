            function exportLibrary() {
                if (library.length === 0) {
                    alert('牌库为空，无法导出。');
                    return;
                }
                const cleanLibrary = library.map(item => ({
                    name: item.name,
                    count: item.count,
                    image: item.image || '',
                    desc: item.desc || ''
                }));
                const data = JSON.stringify(cleanLibrary, null, 2);
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `library_${new Date().toISOString().slice(0, 10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            function importLibrary(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (!Array.isArray(imported)) {
                            throw new Error('文件格式错误：不是数组');
                        }
                        const normalized = imported.map((item, index) => {
                            if (typeof item.name !== 'string' || !item.name.trim()) {
                                throw new Error(`第 ${index+1} 条缺少有效的 "name" 字段`);
                            }
                            if (typeof item.count !== 'number' || item.count < 1) {
                                throw new Error(`第 ${index+1} 条 "count" 必须为正整数`);
                            }
                            let image = null;
                            if (item.image !== undefined && item.image !== null && item.image !== '') {
                                if (typeof item.image !== 'string') {
                                    throw new Error(`第 ${index+1} 条 "image" 类型错误`);
                                }
                                image = item.image;
                            }
                            let desc = '';
                            if (item.desc !== undefined && item.desc !== null) {
                                if (typeof item.desc !== 'string') {
                                    throw new Error(`第 ${index+1} 条 "desc" 类型错误`);
                                }
                                desc = item.desc;
                            }
                            return { name: item.name.trim(), count: item.count, image, desc };
                        });
                        library = normalized;
                        renderLibrary();
                        clearStats();
                        resetRemainingCards();
                        alert(`✅ 导入 ${library.length} 种牌，共 ${getTotalCount()} 张。`);
                    } catch (err) {
                        alert('❌ 导入失败：' + err.message);
                    }
                };
                reader.readAsText(file);
            }

            function updateCoinUI() {
                coinHeads.textContent = coinState.heads;

                coinTotal.textContent = coinState.total;
                const rate = coinState.total > 0 ? (coinState.heads / coinState.total * 100) : 0;

                coinHistory.innerHTML = '';
                const maxHistory = 20;
                const start = Math.max(0, coinState.history.length - maxHistory);
                const display = coinState.history.slice(start);
                for (const side of display) {
                    const item = document.createElement('span');
                    item.className = 'h-item ' + side;
                    item.textContent = side === 'heads' ? '正' : '反';
                    coinHistory.appendChild(item);
                }
                for (let i = display.length; i < maxHistory; i++) {

                    item.className = 'h-item empty';
                    item.textContent = '·';
                    coinHistory.appendChild(item);

            function doCoinFlip() {
                if (coinState.isFlipping) return;

                coinState.isFlipping = true;
                coinFlipBtn.disabled = true;
                coinResult.textContent = '🔄 抛掷中...';

                const result = rng.flipCoin() ? 'heads' : 'tails';

                const baseRotations = 3 + Math.floor(rng.nextDouble() * 3);
                const extraDeg = result === 'heads' ? 0 : 180;
                const randomOffset = rng.nextDouble() * 20 - 10;
                const totalRotation = baseRotations * 360 + extraDeg + randomOffset;

                coinInner.style.transition = 'transform 0.8s cubic-bezier(0.34, 1.2, 0.64, 1)';
                coinInner.style.transform = `rotateY(${totalRotation}deg)`;

                setTimeout(() => {
                    coinState.currentSide = result;
                    if (result === 'heads') {
                        coinState.heads++;
                    } else {
                        coinState.tails++;
                    }
                    coinState.total++;
                    coinState.history.push(result);

                    const exactRotation = result === 'heads' ?
                        (Math.floor(totalRotation / 360) * 360) :
                        (Math.floor(totalRotation / 360) * 360 + 180);
                    coinInner.style.transition = 'none';
                    coinInner.style.transform = `rotateY(${exactRotation}deg)`;
                    setTimeout(() => {
                        coinInner.style.transition = 'transform 0.8s cubic-bezier(0.34, 1.2, 0.64, 1)';
                    }, 50);

                    const emoji = result === 'heads' ? '🦅' : '🏛️';
                    const label = result === 'heads' ? '正面' : '反面';
                    coinResult.innerHTML = `🎉 结果是 <span class="highlight">${emoji} ${label}</span>！`;

                    updateCoinUI();
                    coinState.isFlipping = false;
                    coinFlipBtn.disabled = false;
                }, 850);
            }

            //  随机数生成器
            // ============================================================
            const randMinInput = document.getElementById('rand-min');
            const randMaxInput = document.getElementById('rand-max');
            const randCountInput = document.getElementById('rand-count');
            const randAllowRepeat = document.getElementById('rand-allow-repeat');
            const randSort = document.getElementById('rand-sort');
            const randFormat = document.getElementById('rand-format');
            const btnGenerate = document.getElementById('btn-generate');
            const randResult = document.getElementById('rand-result');
            const randTotal = document.getElementById('rand-total');
            const randSum = document.getElementById('rand-sum');
            const randAvg = document.getElementById('rand-avg');
            const randMaxVal = document.getElementById('rand-max-val');
            const randMinVal = document.getElementById('rand-min-val');

            function generateRandomNumbers() {
                const min = parseFloat(randMinInput.value);
                const max = parseFloat(randMaxInput.value);
                const count = parseInt(randCountInput.value);
                const allowRepeat = randAllowRepeat.checked;
                const sort = randSort.checked;
                const format = randFormat.value;

                if (isNaN(min) || isNaN(max) || isNaN(count) || count < 1) {
                    alert('请填写有效的数字');
                    return;
                }
                if (min > max) {
                    alert('最小值不能大于最大值');
                    return;
                }
                if (!allowRepeat && (max - min + 1) < count) {
                    alert(`范围 [${min}, ${max}] 内最多只能生成 ${max - min + 1} 个不重复的数字`);
                    return;
                }

                const result = [];
                if (allowRepeat) {
                    for (let i = 0; i < count; i++) {
                        let num;
                        if (format === 'float') {
                            num = rng.nextFloat(min, max);
                        } else {
                            num = rng.nextInt(Math.ceil(min), Math.floor(max));
                        }
                        result.push(num);
                    }
                } else {
                    const pool = [];
                    for (let i = Math.ceil(min); i <= Math.floor(max); i++) pool.push(i);
                    if (pool.length < count) {
                        alert(`范围 [${Math.ceil(min)}, ${Math.floor(max)}] 内整数不足 ${count} 个`);
                        return;
                    }
                    rng.shuffleArray(pool);
                    for (let i = 0; i < count && i < pool.length; i++) {
                        result.push(pool[i]);
                    }
                }

                if (sort) {
                    result.sort((a, b) => a - b);
                }

                const displayResult = result.map(v => {
                    if (format === 'float') return v.toFixed(2);
                    if (format === 'percent') return (v * 100).toFixed(1) + '%';
                    return v.toString();
                });

                const sum = result.reduce((s, v) => s + v, 0);
                const avg = result.length > 0 ? (sum / result.length) : 0;
                const maxVal = result.length > 0 ? Math.max(...result) : '-';
                const minVal = result.length > 0 ? Math.min(...result) : '-';

                randTotal.textContent = result.length + ' 个';
                randSum.textContent = format === 'float' ? sum.toFixed(2) : (format === 'percent' ? (sum * 100).toFixed(
                    1) + '%' : sum);
                randAvg.textContent = format === 'float' ? avg.toFixed(2) : (format === 'percent' ? (avg * 100).toFixed(
                    1) + '%' : avg.toFixed(2));
                randMaxVal.textContent = format === 'float' ? maxVal.toFixed(2) : (format === 'percent' ? (maxVal * 100)
                    .toFixed(1) + '%' : maxVal);
                randMinVal.textContent = format === 'float' ? minVal.toFixed(2) : (format === 'percent' ? (minVal * 100)
                    .toFixed(1) + '%' : minVal);

                randResult.innerHTML = '';
                if (displayResult.length === 0) {
                    randResult.innerHTML = '<span class="empty-text">没有生成任何数字</span>';
                    return;
                }
                for (const num of displayResult) {
                    const chip = document.createElement('span');
                    chip.className = 'rand-chip';
                    chip.textContent = num;
                    randResult.appendChild(chip);
                }
            }

            btnGenerate.addEventListener('click', generateRandomNumbers);
            randResult.innerHTML = '<span class="empty-text">点击生成</span>';
